<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tarkVtark - Enhanced Social Debate Drill-Down</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel-left: #161b22;
            --panel-right: #0d1117;
            --accent: #58a6ff;
            --pro: #238636;
            --pro-bg: rgba(35, 134, 54, 0.15);
            --con: #da3633;
            --con-bg: rgba(218, 54, 51, 0.15);
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --border: #30363d;
            --transition-speed: 0.2s;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- BREADCRUMBS --- */
        .breadcrumbs {
            padding: 14px 25px;
            background: #010409;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            display: flex;
            gap: 8px;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
        }
        .breadcrumb-item { 
            color: var(--accent); 
            cursor: pointer; 
            padding: 4px 8px; 
            border-radius: 4px;
            transition: background var(--transition-speed);
        }
        .breadcrumb-item:hover { background: #21262d; }
        .breadcrumb-sep { color: #484f58; font-weight: bold; }

        /* --- LAYOUT --- */
        .main-view { display: flex; flex: 1; overflow: hidden; }
        .panel { flex: 1; padding: 30px 40px; overflow-y: auto; box-sizing: border-box; }
        .panel-left { background: var(--panel-left); border-right: 1px solid var(--border); }
        .panel-right { background: var(--panel-right); }

        /* --- SIBLING SWITCHER --- */
        .switcher-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: #21262d;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .nav-btn {
            background: #30363d;
            border: 1px solid var(--border);
            color: white;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all var(--transition-speed);
        }
        .nav-btn:hover:not(:disabled) { border-color: var(--accent); background: #484f58; }
        .nav-btn:disabled { opacity: 0.15; cursor: not-allowed; }
        .shortcut-hint { font-size: 0.65rem; color: var(--text-muted); display: block; text-align: center; margin-top: 2px; }

        /* --- CARDS & BADGES --- */
        .card {
            background: #1c2128;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            position: relative;
            transition: transform var(--transition-speed), border-color var(--transition-speed);
        }
        .clickable-card { cursor: pointer; }
        .clickable-card:hover { 
            transform: translateX(6px); 
            border-color: var(--accent); 
            background: #22272e;
        }
        
        .pro-border { border-left: 5px solid var(--pro); }
        .con-border { border-left: 5px solid var(--con); }
        
        .card-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 14px; 
        }
        .card-author { font-weight: 600; color: var(--accent); font-size: 0.95rem; }
        
        .stance-badge {
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .stance-badge.pro { background: var(--pro-bg); color: #56d364; border: 1px solid rgba(53, 191, 78, 0.3); }
        .stance-badge.con { background: var(--con-bg); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); }
        
        .level-tag { font-size: 0.7rem; background: #30363d; padding: 3px 8px; border-radius: 4px; color: var(--text-muted); }
        .card-body { font-size: 1rem; line-height: 1.6; color: #adbac7; }

        /* --- SYSTEM LEGEND --- */
        .keyboard-legend {
            margin-top: 20px;
            padding: 12px;
            background: rgba(1, 4, 9, 0.4);
            border: 1px dashed var(--border);
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-around;
        }
        kbd {
            background: #21262d;
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 1px 5px;
            color: white;
        }

        /* --- INTERACTIVE TREE MINIMAP --- */
        .minimap-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: rgba(1, 4, 9, 0.95);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 200px;
        }
        .minimap-title { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: bold; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
        .minimap-tree { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 4px 0; }
        .map-node {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #30363d;
            cursor: pointer;
            transition: all var(--transition-speed);
            position: relative;
        }
        .map-node.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); transform: scale(1.2); }
        .map-node:hover::after {
            content: attr(data-label);
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: #21262d;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.6rem;
            white-space: nowrap;
            border: 1px solid var(--border);
            z-index: 10;
        }
        .map-connector { flex: 1; height: 2px; background: var(--border); min-width: 12px; }
        .map-connector.active { background: var(--accent); }
    </style>
</head>
<body>

    <nav class="breadcrumbs" id="breadcrumb-nav"></nav>

    <main class="main-view">
        <section class="panel panel-left">
            <div class="switcher-header">
                <div>
                    <button class="nav-btn" id="prev-btn">← Previous</button>
                    <span class="shortcut-hint">← key</span>
                </div>
                <span id="sibling-indicator" style="font-size: 0.8rem; font-weight: bold; color: var(--text-muted);">CONTEXT</span>
                <div>
                    <button class="nav-btn" id="next-btn">Next →</button>
                    <span class="shortcut-hint">→ key</span>
                </div>
            </div>
            <div id="left-content"></div>
            
            <div class="keyboard-legend">
                <span><kbd>←</kbd> <kbd>→</kbd> Navigate Siblings</span>
                <span><kbd>Backspace</kbd> Go Up Level</span>
            </div>
        </section>

        <section class="panel panel-right">
            <h3 style="margin-top: 0; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Counter Replies / Claims</h3>
            <div id="right-content"></div>
        </section>
    </main>

    <div class="minimap-container">
        <div class="minimap-title">Debate Depth Path</div>
        <div class="minimap-tree" id="interactive-tree"></div>
    </div>

    <script>
        // CORE DEBATE RESOURCE TREE
        const simpleDebates = {
            "root": "Should facial coverings (like the burka) be allowed in all public spaces?",
            "L1": ["It is a matter of religious freedom and personal choice.", "Public safety requires faces to be visible for identification.", "It can be seen as a barrier to social integration and communication."],
            "L2": ["The state should not dictate a woman's wardrobe.", "Facial expressions are vital for building trust in a community.", "Security cameras cannot function if faces are hidden."],
            "L3": ["Freedom implies the right to be 'different' without penalty.", "In a secular state, religious symbols should be private, not public.", "Communication happens through many ways, not just facial sight."],
            "L4": ["Secularism should mean neutrality, not the banning of faith.", "Masks for health are allowed, so why not for religion?", "Integration is achieved through education, not clothing bans."],
            "L5": ["Individual safety is compromised if people are unrecognizable.", "Human rights should protect the minority from the majority's taste.", "Legal consistency: you can't ban one veil and allow sunglasses."],
            "L6": ["The law must be blind to religion to remain fair.", "Choice is only valid if it's truly free from family pressure.", "Ultimately, a free society must tolerate things it dislikes."]
        };

        function generateData(level, idPrefix, authorBase) {
            if (level > 6) return [];
            let children = [];
            const suffixes = ["A", "B", "C"];
            const content = simpleDebates[`L${level}`];
            
            for (let i = 0; i < 3; i++) {
                const id = `${idPrefix}_${i}`;
                // Explicit alternating context mapping logic
                const stance = i === 0 ? "PRO" : "CON"; 
                children.push({
                    id: id,
                    level: level,
                    author: `User L${level}_${suffixes[i]}`,
                    body: content[i] || `Level ${level} deeper analysis on point ${suffixes[i]}.`,
                    stance: stance,
                    children: generateData(level + 1, id, `User L${level+1}`)
                });
            }
            return children;
        }

        const rootData = {
            id: "root",
            level: 0,
            author: "Moderator_Ravinder",
            body: simpleDebates.root,
            stance: "PRO",
            children: generateData(1, "root", "User L1")
        };

        let path = [rootData];
        let currentNode = rootData;

        function render() {
            const leftContent = document.getElementById('left-content');
            const rightContent = document.getElementById('right-content');
            const breadcrumbNav = document.getElementById('breadcrumb-nav');
            const interactiveTree = document.getElementById('interactive-tree');

            // 1. Breadcrumbs
            breadcrumbNav.innerHTML = path.map((node, i) => 
                `<span class="breadcrumb-item" onclick="jumpTo(${i})">${node.author}</span>`
            ).join('<span class="breadcrumb-sep">❯</span>');

            // 2. Active Left Panel Element (Parent Node Context)
            leftContent.innerHTML = `
                <div class="card ${currentNode.stance === 'PRO' ? 'pro-border' : 'con-border'}">
                    <div class="card-header">
                        <span class="card-author">${currentNode.author}</span>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <span class="stance-badge ${currentNode.stance.toLowerCase()}">${currentNode.stance}</span>
                            <span class="level-tag">Depth ${currentNode.level}</span>
                        </div>
                    </div>
                    <div class="card-body">${currentNode.body}</div>
                </div>
            `;

            // 3. Right Counter Cards Layout
            rightContent.innerHTML = currentNode.children.length > 0 ? 
                currentNode.children.map(child => `
                    <div class="card clickable-card ${child.stance === 'PRO' ? 'pro-border' : 'con-border'}" onclick="goDown('${child.id}')">
                        <div class="card-header">
                            <span class="card-author">${child.author}</span>
                            <span class="stance-badge ${child.stance.toLowerCase()}">${child.stance === 'PRO' ? 'Argument (PRO)' : 'Counter (CON)'}</span>
                        </div>
                        <div class="card-body">${child.body}</div>
                    </div>
                `).join('') : `<p style="color:var(--text-muted); text-align:center; margin-top: 40px; font-style: italic;">Maximum conversational depth structural limit reached.</p>`;

            // 4. Sibling Navigation Handlers
            const parent = path.length > 1 ? path[path.length - 2] : null;
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const indicator = document.getElementById('sibling-indicator');

            if (parent) {
                const idx = parent.children.findIndex(c => c.id === currentNode.id);
                indicator.innerText = `REPLY ${idx + 1} OF ${parent.children.length}`;
                prevBtn.disabled = idx === 0;
                nextBtn.disabled = idx === parent.children.length - 1;
                
                prevBtn.onclick = () => switchSibling(parent.children[idx - 1]);
                nextBtn.onclick = () => switchSibling(parent.children[idx + 1]);
            } else {
                indicator.innerText = "ROOT DISCOURSE TOPIC";
                prevBtn.disabled = nextBtn.disabled = true;
            }

            // 5. Interactive Tree-Map Generation
            let treeHtml = [];
            for (let i = 0; i <= 6; i++) {
                const isActive = i <= currentNode.level;
                const isCurrent = i === currentNode.level;
                treeHtml.push(
                    `<div class="map-node ${isActive ? 'active' : ''} ${isCurrent ? 'current' : ''}" 
                          data-label="Depth ${i}" 
                          onclick="${isActive ? `jumpTo(${i})` : ''}">
                     </div>`
                );
                if (i < 6) {
                    treeHtml.push(`<div class="map-connector ${i < currentNode.level ? 'active' : ''}"></div>`);
                }
            }
            interactiveTree.innerHTML = treeHtml.join('');
        }

        // CONTROL INTERACTIONS
        function goDown(id) {
            const target = currentNode.children.find(c => c.id === id);
            path.push(target);
            currentNode = target;
            render();
        }

        function switchSibling(node) {
            path[path.length - 1] = node;
            currentNode = node;
            render();
        }

        function jumpTo(index) {
            if(index >= path.length) return;
            path = path.slice(0, index + 1);
            currentNode = path[path.length - 1];
            render();
        }

        // WINDOWS DESKTOP HOTKEY MANAGER
        window.addEventListener('keydown', function(e) {
            const parent = path.length > 1 ? path[path.length - 2] : null;
            if (!parent) return;

            const idx = parent.children.findIndex(c => c.id === currentNode.id);

            if (e.key === 'ArrowLeft' && idx > 0) {
                switchSibling(parent.children[idx - 1]);
            } else if (e.key === 'ArrowRight' && idx < parent.children.length - 1) {
                switchSibling(parent.children[idx + 1]);
            } else if (e.key === 'Backspace') {
                e.preventDefault(); // Stop default browser back tracking
                jumpTo(path.length - 2);
            }
        });

        // Initialize App View Execution
        render();
    </script>
</body>
</html>

spring:
  config:
    import: optional:file:.env.dev[.properties]

  application:
    name: debate-arena-backend


  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

file:
  provider: ${FILE_PROVIDER:local}  # Can be: local, supabase, s3, r2 (from .env.dev)
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  max-size: 10485760
  base-url: ${FILE_BASE_URL:http://localhost:8080}
  allowed-types: image/*,video/*,audio/*,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document

# =====================================================================
# Supabase Storage Configuration (for development)
# =====================================================================
supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage-bucket: ${SUPABASE_STORAGE_BUCKET:attachments}

# AWS S3 Configuration (for development - if needed)
aws:
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${AWS_S3_BUCKET:debate-arena-uploads}
    base-url: ${AWS_S3_BASE_URL:https://s3.amazonaws.com}
  region: ${AWS_REGION:us-east-1}

# Cloudflare R2 Configuration (for development - if needed)
r2:
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket: ${R2_BUCKET:}
  endpoint: ${R2_ENDPOINT:}
  public-base-url: ${R2_PUBLIC_BASE_URL:}
  region: ${R2_REGION:us-east-1}
  level:
    com.debatearena: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

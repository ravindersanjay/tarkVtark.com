spring:
  config:
    import: optional:file:.env.dev[.properties]

  application:
    name: debate-arena-backend


  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

file:
  provider: local
  upload-dir: ./uploads-dev
  max-size: 10485760
  base-url: http://localhost:8081
  allowed-types: image/*,video/*,audio/*,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document

logging:
  level:
    com.debatearena: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

spring:
  config:
    import: optional:file:.env.prod[.properties]


  application:
    name: debate-arena-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

file:
  provider: ${file.provider}
  upload-dir: ${FILE_UPLOAD_DIR}
  max-size: ${FILE_MAX_SIZE}
  base-url: https://www.debatemanch.com/
  allowed-types: image/*,video/*,audio/*,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document

logging:
  level:
    com.debatearena: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
